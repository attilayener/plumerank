# PlumeRank -- TRAINING dependencies. Never installed on the server.
# Two scripts use these: scripts/train_tile_classifier.py, and the pyrosdis path of
# scripts/fetch.py. They run once, on CPU, on a laptop, and their only output the endpoint
# ever sees is models/tile_classifier.onnx. The endpoint executes that ONNX through cv2.dnn
# and has no torch in its dependency tree at all.

