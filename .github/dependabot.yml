version: 2
# Frozen for the held-out evaluation and judging (Oct 2026): version-update PRs are off
# (open-pull-requests-limit: 0). Dependabot SECURITY updates and alerts stay on -- they are
# not governed by this limit. Even a numpy minor moves the numerics the fitted constants
# assume, so dependency changes are deliberate commits, not unattended merges.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps (incl. opencv-contrib-python-headless and numpy) are re-validation
      # work against a pipeline whose fitted constants assume this exact runtime — a
      # deliberate, separate decision, not unattended maintenance.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
