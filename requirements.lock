# PlumeRank -- runtime dependencies, FULLY pinned: every transitive, exact ==.
# The server installs exactly this. torch/onnx are NOT here on purpose: training is
# offline and never runs on the endpoint (requirements-train.lock). Test and lint tools
# are NOT here either -- they live in requirements-dev.lock, which includes this file.
#
# Regenerate (versions already in this file are kept unless a top-level pin moves):
#   uv pip compile pyproject.toml --universal --python-version 3.11 \
#     --no-header --no-annotate -o requirements.lock
# Every pin below resolves to binary wheels on manylinux_2_28 aarch64 (the t4g endpoint)
# and x86_64 (CI) for Python 3.11 -- checked with --only-binary :all:, so no box ever
# compiles a dependency from source. No hashes: one lock serves macOS, aarch64 and x86_64.
#
# OpenCV 5 comes from the PyPI wheel: a manylinux_2_28_aarch64 wheel exists for
# 5.0.0.93 (confirmed 2026-09-04), so nothing is built from source.

