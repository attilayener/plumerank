[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumerank"
version = "0.1.0"
description = "Ranks which wildfire-camera tiles a dispatcher should look at next, at a fixed budget of 2 alerts per camera-night."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "opencv-contrib-python-headless==5.0.0.93",
  "numpy==2.1.3",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "boto3==1.35.76",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==5.0.0", "httpx==0.28.1"]

[tool.setuptools]
packages = ["plumerank", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: hits a real external service (AWS or the deployed endpoint); excluded from `make test`",
]

[tool.coverage.run]
source = ["plumerank"]
